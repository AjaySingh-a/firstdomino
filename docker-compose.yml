services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      # RDB snapshots alone only save on a clean shutdown or every few minutes; the append-only
      # file also keeps confirmed evidence across a crash or a kill.
      REDIS_ARGS: --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"  # Redis protocol
      - "3000:3000"  # FalkorDB Browser
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # FalkorDB is the source of truth here. Set FD_STORE=fixtures to serve the in-memory stub instead.
      FD_STORE: ${FD_STORE:-graph}
      FD_FAMILY: ${FD_FAMILY:-demo}
      FD_STORIES: ${FD_STORIES:-1 2 3}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FD_CORS_ORIGINS: http://localhost:3001
      # The review agent's LLM: any OpenAI-compatible chat API with json_object mode (Groq by
      # default). No key: the agent runs on its templates.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      FD_AGENT_MODEL: ${FD_AGENT_MODEL:-openai/gpt-oss-120b}
      # Used for the rest of a pass once the main model answers 429 / 5xx or times out.
      FD_AGENT_FALLBACK_MODEL: ${FD_AGENT_FALLBACK_MODEL:-openai/gpt-oss-20b}
    ports:
      - "8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # live = the api service above (FalkorDB). fixtures = data/snapshots, no API needed.
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-live}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_INTERNAL_URL: http://api:8000  # server-side fetches; the browser uses NEXT_PUBLIC_API_URL
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

  # `make test-stack`: graph tests against the falkordb service and HTTP tests against the running
  # api container (graph mode), from inside the compose network.
  api-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: api/Dockerfile
      target: test
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FD_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  falkordb_data:
